# Dependabot bumps the pins it manages here (the two ecosystems below);
# not every dependency CI uses is pinned (see the workflows). Pins keep a
# tool release from turning CI red on an unchanged commit, but go stale
# silently, and a stale pin is how a fixed CVE stays exploitable.
# Dependabot is the counterpart to audit.yml, which detects that but
# cannot fix it.
#
# Dependabot PRs get the same `pull_request` checks as any other PR.
#
# There is no npm entry: this repo has no JavaScript at all.

version: 2
updates:
  # requirements-dev.txt (lint/type toolchain) and requirements-test.txt
  # (coverage). There is no runtime entry: the distributed package is
  # stdlib-only on purpose.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # The workflows pin every action to a commit SHA with the version in a
  # trailing comment. A SHA pin does not move at all — which is the point,
  # since these jobs run with a repository token — and it is also why this
  # entry is not optional: without Dependabot a SHA pin is simply frozen
  # forever. It rewrites both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    # codeql.yml's init and analyze steps must sit on the same release or
    # `analyze` fails, so one group keeps their bumps in one pull request.
    # A group applies to one update kind, so there is one group for each.
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
