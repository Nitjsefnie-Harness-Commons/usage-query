# Every dependency in this repo is pinned to an exact version, deliberately:
# a tool or library release must never turn CI red on an unchanged commit.
# The cost of that choice is that pins go stale silently, and a stale pin is
# how a fixed CVE stays exploitable. Dependabot pays that cost back — it is
# the counterpart to audit.yml, which detects the problem but cannot fix it.
#
# Dependabot PRs are built like any other PR: lint, types, tests, audit and
# codeql run on every `pull_request`, and actionlint on those that touch
# the workflows or this file, so a bump is built as soon as it is opened.
#
# There is no npm entry: this repo has no JavaScript at all.

version: 2
updates:
  # requirements-dev.txt (lint/type toolchain) and requirements-test.txt
  # (coverage). There is no runtime entry: the distributed package is
  # stdlib-only on purpose, so these tool pins are the entire pip surface.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # The workflows pin every action to a commit SHA with the version in a
  # trailing comment. A SHA pin does not move at all — which is the point,
  # since these jobs run with a repository token — and it is also why this
  # entry is not optional: without Dependabot a SHA pin is simply frozen
  # forever. It rewrites both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    # codeql.yml runs github/codeql-action/init and /analyze, and a job whose
    # two steps sit on different release versions fails at `analyze`. Dependabot
    # names each sub-action as its own dependency, so without a group it opens
    # one pull request per sub-action, each of which is red alone. Version
    # updates only: a group with no `applies-to` covers nothing else, and this
    # repository has Dependabot security updates off. Turning them on needs a
    # second group here with `applies-to: security-updates`.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
