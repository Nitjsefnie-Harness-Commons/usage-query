name: codeql

# Static security analysis (advanced setup, not the repo-settings "default
# setup" — the config lives here so it is reviewable in a diff like every
# other gate). Free on this public repository; findings are uploaded to the
# Security tab and this job is not configured to fail on them. On a pull
# request, GitHub's separate "Code scanning results" check does fail by
# default on a finding of error, critical or high severity.
#
# The weekly cron is not redundant with ci-gate.yml, which calls this per
# push or pull request and skips a change touching nothing but Markdown,
# LICENSE or .gitignore. The scheduled run analyses the last commit on the
# default branch, so that branch is re-analysed even after weeks with no
# code change pushed to it. GitHub gives the reason for scanning on a
# schedule: it informs you about the latest vulnerabilities and errors that
# GitHub, security researchers and the community discover, even when
# developers aren't actively maintaining the repository.

on:
  workflow_call:
  schedule:
    # Wednesday 03:47 UTC. Off the hour and off Monday deliberately: the top
    # of the hour is when every cron on GitHub fires at once and jobs queue.
    - cron: '47 3 * * 3'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow == 'codeql' && format('codeql-{0}', github.ref) || format('codeql-called-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      # Writing the analysis results is the whole point; everything else
      # stays read-only.
      security-events: write
      actions: read
      contents: read

    strategy:
      # Only one language here — this repo has no JS at all. The matrix
      # stays a matrix so adding one later is a one-line change rather
      # than a restructure.
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:` here, so this checks out the event's own commit: on
          # `pull_request` the PR's merge commit, on `push` the pushed commit.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` over the default `code-scanning` suite: it is
          # that suite plus lower severity and precision queries. This code
          # parses credential and account-state files off disk and builds
          # paths from names in them, so the extra queries are worth their
          # extra noise.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
